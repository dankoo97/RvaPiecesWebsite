[project]
name = ""
version = "0.0.1"
requires-python = "~=3.13"
dependencies = [
    "django>=5.0,<6.0",
    "django-ckeditor-5",
    "gunicorn",
    "psycopg2-binary",
    "sqlparse",
    "asgiref",
    "django-recurring>=1.3.3",
    "django-storages[google]",
    "django-cors-headers",
    "cloud-sql-python-connector[pg8000]",
    "django-sass",
    "django-bootstrap5",
    "django-bootstrap-icons",
    "chess",
    "crispy-bootstrap5",
    "django-crispy-forms",
    "discord-webhook",
    "pre-commit",
    "berserk",
]

[tool.uv.sources]
berserk = { git = "https://github.com/dankoo97/berserk.git", branch = "master" }

[dependency-groups]
dev = [
    "ruff",
    "djlint",
    "pre-commit",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
