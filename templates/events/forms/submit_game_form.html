{% extends "template.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}
    <link rel="stylesheet"
          href="{% static 'styles/chessboard-1.0.0.min.css' %}" />
    <link rel="stylesheet" href="{% static 'styles/board-input.css' %}" />
    <h2>{{ event.name }}</h2>
    <p>Share your game in our private lichess study!</p>
    <p>Upload or paste a pgn file to auto complete</p>
    {% crispy form %}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="{% static 'js/chessboard-1.0.0.min.js' %}"></script>
    <script src="{% static 'js/game-input-logic.bundle.min.js' %}"></script>
{% endblock content %}
