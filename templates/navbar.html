{% load static %}
<style>
    .nav-item.dropdown:hover .dropdown-menu {
        display: block;
    }

    .dropdown-menu {
        margin-top: 0;
        transition: all 0.2s;
    }

    nav {
        font-size: 1.2rem;
    }

</style>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">
            <img width="150"
                 height="150"
                 {% if theme == "dark" %} src="{% static 'rvapieces-logo-transparent-dark.png' %}" {% else %} src="{% static 'rvapieces-logo-transparent.png' %}" {% endif %}
                 alt="RVA Pieces logo">
        </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"

                        <a class="dropdown-item" href="{% url 'code_of_conduct' %}">Code of Conduct</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'schedule' %}">Schedule</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       id="coachingDropdown"

                       aria-haspopup="true"

                    <div class="dropdown-menu" aria-labelledby="coachingDropdown">
