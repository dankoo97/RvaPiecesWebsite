{% load static %}
{% load cache %}
{% cache 43200 navbar %}
<link rel="stylesheet" href="{% static 'styles/nav.css' %}">
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">
            <img width="150"
                 height="150"
                 {% if theme == "dark" %} src="{% static 'images/rvapieces-logo-transparent-dark.png' %}" {% else %} src="{% static 'images/rvapieces-logo-transparent.png' %}" {% endif %}
                 alt="RVA Pieces logo">
        </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       id="aboutUsDropdown"
                       type="button"
                       data-bs-toggle="dropdown"
                       aria-haspopup="true"
                       aria-expanded="false">About Us</a>
                    <div class="dropdown-menu" aria-labelledby="aboutUsDropdown">
                        <a class="dropdown-item" href="{% url 'who_we_are' %}">Who We Are</a>
                        <a class="dropdown-item" href="{% url 'contact_us' %}">Get In Touch</a>
                        <a class="dropdown-item" href="{% url 'code_of_conduct' %}">Code of Conduct</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'schedule' %}">Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'private_coaching' %}">Coaching</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'faq' %}">FAQ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'donate' %}">Donate</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                {% include "social-media.html" %}
            </ul>
        </div>
    </div>
</nav>
{% endcache %}
