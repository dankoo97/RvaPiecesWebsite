{% load static %}
{% load django_bootstrap5 %}
{% with "light" as theme %}
    <!DOCTYPE html>
    <html lang="en" data-bs-theme="{{ theme }}">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="X-UA-Compatible" content="ie=edge">
            <meta name="description"
                  content="RVA Pieces is a 501(c)3 nonprofit organization that exists to foster a thriving environment and active community for casual and competitive chess in our city, as well as provide access to stellar chess education for everyone, regardless of age or skill level.">
            <meta name="keywords" content="chess, RVA, Richmond, Virginia">
            <title>RVA Pieces</title>
            {% bootstrap_css %}
            <link rel="stylesheet"
                  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
            <link rel="icon" href="{% static 'images/favicon.png' %}">
        </head>
        <body>
            <header>
                <div class="container">{% include "navbar.html" %}</div>
            </header>
            <main>
                <div class="container">
                    {% block content %}
                    {% endblock content %}
                </div>
            </main>
            <footer>
                <div class="container-fluid bg-{{ theme }} text-white text-center py-3 sticky-bottom">
                    <ul class="nav justify-content-center">
                        {% include "social-media.html" %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                        </li>
                    </ul>
                </div>
            </footer>
            {% bootstrap_javascript %}
        </body>
    </html>
{% endwith %}
