# Cloud Run settings shared by prod and dev. prod.yaml / dev.yaml are layered on top and
# override anything with the same name.
#
# Every deploy applies the merged result IN FULL: a variable that isn't listed in
# common.yaml + <target>.yaml is removed from the new revision. Change settings here (via PR),
# not in the Cloud Run console, or the next deploy will undo the change.
#
#   env:      plain values (quote everything; Cloud Run needs strings)
#   secrets:  ENV_NAME: <secret name in Secret Manager>:<version or latest>
#             The runtime service account (django-gcs-access) needs Secret Accessor on it.

env:
  DJANGO_SETTINGS_MODULE: "RvaPiecesWebsite.settings"
  DJANGO_ALLOWED_HOSTS: "rvapieces.org,.a.run.app,.run.app"
  CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:8080,https://rvapieces.org,https://rva-pieces-website-697368313332.us-east4.run.app,https://prod---rva-pieces-website-697368313332.us-east4.run.app,https://dev---rva-pieces-website-697368313332.us-east4.run.app,https://latest---rva-pieces-website-697368313332.us-east4.run.app,https://rva-pieces-website-7er2of6acq-uk.a.run.app,https://prod---rva-pieces-website-7er2of6acq-uk.a.run.app,https://dev---rva-pieces-website-7er2of6acq-uk.a.run.app,https://latest---rva-pieces-website-7er2of6acq-uk.a.run.app"
  CORS_ALLOWED_ORIGINS: "http://127.0.0.1:8080,https://rvapieces.org,https://rva-pieces-website-697368313332.us-east4.run.app,https://prod---rva-pieces-website-697368313332.us-east4.run.app,https://dev---rva-pieces-website-697368313332.us-east4.run.app,https://latest---rva-pieces-website-697368313332.us-east4.run.app,https://rva-pieces-website-7er2of6acq-uk.a.run.app,https://prod---rva-pieces-website-7er2of6acq-uk.a.run.app,https://dev---rva-pieces-website-7er2of6acq-uk.a.run.app,https://latest---rva-pieces-website-7er2of6acq-uk.a.run.app"
  GOOGLE_CLOUD_PROJECT: "rva-pieces-website"
  SERVICE_ACCOUNT: "django-gcs-access@rva-pieces-website.iam.gserviceaccount.com"
  SIGNER_SERVICE_ACCOUNT: "rva-pieces-website-signer-sa@rva-pieces-website.iam.gserviceaccount.com"
  GS_BUCKET_NAME: "rva-pieces-website_media"
  DB_BUCKET_NAME: "rva-pieces-website_db"
  USE_REMOTE_DB: "True"
  LOCAL_DB_PATH: "/tmp/db.sqlite3"
  CHESSNUT_CLUB_ID: "945"
  DONATION_LINK: "https://buy.stripe.com/9B64gB3Fdbvs3LG3XE6g800"

secrets:
  DJANGO_SECRET_KEY: "django_sercret_key:latest"
  DJANGO_SUPERUSER_PASSWORD: "superuser_password:latest"
  CHESSNUT_API_KEY: "chessnut_api_key:4"
  LICHESS_API_TOKEN: "LICHESS_API_TOKEN:latest"
