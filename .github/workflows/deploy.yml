# Deploys the site to Cloud Run.
#
#   push to main            -> "prod" revision tag, receives 100% of traffic (rvapieces.org)
#   push to dev             -> "dev" revision tag, 0% traffic, own URL
#   manual run on any other branch (Actions tab or `gh workflow run deploy.yml --ref <branch>`)
#                           -> replaces whatever is on "dev" with that branch, for testing
#
# Every dev deploy first copies the production SQLite database to a separate dev path, so
# the dev site starts with real data and never writes to the production database.
# Settings (env vars + Secret Manager refs) live in deploy/env/ and are applied in full on each deploy.

name: Deploy to Cloud Run

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

env:
  PROJECT_ID: rva-pieces-website
  REGION: us-east4
  SERVICE: rva-pieces-website
  IMAGE: us-central1-docker.pkg.dev/rva-pieces-website/rva-pieces-website-docker-repo/rva-pieces-website
  DB_BUCKET: rva-pieces-website_db

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy per target at a time; queued deploys wait instead of cancelling a running one.
    concurrency:
      group: deploy-${{ (github.ref_name == 'main') && 'prod' || 'dev' }}
      cancel-in-progress: false
    steps:
      - name: Pick target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo "name=prod" >> "$GITHUB_OUTPUT"
          else echo "name=dev" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bundle JavaScript
        run: npm ci && npm run build:js

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        env:
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$TARGET" .
          docker push --all-tags "$IMAGE"

      # Settings come from deploy/env/common.yaml + deploy/env/<target>.yaml and are applied in
      # full, so a revision never inherits settings from whichever revision was deployed last.
      - name: Render settings
        id: settings
        env:
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          merged() { yq eval-all '. as $f ireduce ({}; . * $f)' deploy/env/common.yaml "deploy/env/$1.yaml"; }
          merged "$TARGET" | yq '.env | (.[] style="double")' > "$RUNNER_TEMP/env.yaml"
          secrets=$(merged "$TARGET" | yq '(.secrets // {}) | to_entries | map(.key + "=" + .value) | join(",")')
          prod_db=$(merged prod | yq '.env.REMOTE_DB_PATH')
          dev_db=$(merged dev | yq '.env.REMOTE_DB_PATH')
          if [ -z "$dev_db" ] || [ "$dev_db" = "null" ] || [ "$dev_db" = "$prod_db" ]; then
            echo "::error::deploy/env/dev.yaml must set a REMOTE_DB_PATH different from prod's ($prod_db)"
            exit 1
          fi
          echo "Settings for $TARGET:"; yq 'keys' "$RUNNER_TEMP/env.yaml"; echo "Secrets: $secrets" | sed 's/=[^,]*//g'
          {
            echo "env_file=$RUNNER_TEMP/env.yaml"
            echo "secrets=$secrets"
            echo "prod_db=$prod_db"
            echo "dev_db=$dev_db"
          } >> "$GITHUB_OUTPUT"

      - name: Copy production database to dev
        if: steps.target.outputs.name == 'dev'
        env:
          PROD_DB: ${{ steps.settings.outputs.prod_db }}
          DEV_DB: ${{ steps.settings.outputs.dev_db }}
        run: gcloud storage cp "gs://$DB_BUCKET/$PROD_DB" "gs://$DB_BUCKET/$DEV_DB"

      - name: Deploy revision
        env:
          TARGET: ${{ steps.target.outputs.name }}
          ENV_FILE: ${{ steps.settings.outputs.env_file }}
          SECRETS: ${{ steps.settings.outputs.secrets }}
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" --no-traffic --tag "$TARGET" \
            --env-vars-file "$ENV_FILE" --set-secrets "$SECRETS"

      - name: Send all traffic to prod
        if: steps.target.outputs.name == 'prod'
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-tags prod=100

      - name: Summary
        env:
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          url="https://${TARGET}---${SERVICE}-7er2of6acq-uk.a.run.app"
          echo "Deployed \`$GITHUB_REF_NAME\` ($GITHUB_SHA) to **$TARGET**: $url" >> "$GITHUB_STEP_SUMMARY"
